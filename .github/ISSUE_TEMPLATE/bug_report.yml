name: Bug report
description: Report a reproducible defect in LLM Compat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Remove API keys, account identifiers, private
        endpoint URLs, and unsanitized provider bodies before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command or Python snippet that reproduces the issue.
      placeholder: |
        llm-compat run --provider custom --base-url https://example.invalid/v1 --dry-run
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LLM Compat version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: "Python 3.11.9 on macOS 14"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Protocol checks or reports
        - CLI
        - Agent profiles
        - Research experiments
        - Documentation or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Paste relevant output after removing credentials and private data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed API keys, account identifiers, and private endpoint URLs.
          required: true
        - label: I did not include unsanitized live research output.
          required: true
