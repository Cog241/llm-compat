name: Feature request
description: Propose a check, profile, research capability, or documentation improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What compatibility question or workflow is currently blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and the API or CLI it would add.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New protocol check
        - Agent profile
        - Research experiment capability
        - CLI or report output
        - Provider preset or adapter
        - Documentation or packaging
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Documentation or evidence
      description: Link public provider or agent documentation. Do not paste credentials or private data.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain workarounds or a narrower option.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Compatibility
      options:
        - label: The proposal preserves the default checks and stable report schema, or documents a migration.
          required: true
        - label: The proposal can be tested offline with the mock server.
          required: true
