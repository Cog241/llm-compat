[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-compat"
dynamic = ["version"]
description = "Open-source compatibility testing toolkit for OpenAI-compatible LLM APIs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LLM Compat contributors" }]
keywords = ["llm", "openai", "compatibility", "testing", "cli", "agents", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Cog241/llm-compat"
Repository = "https://github.com/Cog241/llm-compat"
Issues = "https://github.com/Cog241/llm-compat/issues"
Changelog = "https://github.com/Cog241/llm-compat/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Cog241/llm-compat#readme"

[project.scripts]
llm-compat = "llm_compat.cli:main"

[tool.setuptools.dynamic]
version = { attr = "llm_compat.version.__version__" }

[tool.setuptools.packages.find]
include = ["llm_compat*"]

[tool.setuptools.package-data]
llm_compat = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["llm_compat"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
